<!doctype html>
<html lang="en-IE" data-theme="dark" data-density="touch">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ee3744" />
    <link rel="icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Session Hire</title>
    <!-- Dark unless this device chose light or to match the phone (web/src/theme.ts), set before anything is drawn so it never flicks over. -->
    <script>
      try {
        var kept = localStorage.getItem('sh.theme')
        if (kept === 'light' || kept === 'auto') document.documentElement.dataset.theme = kept
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
