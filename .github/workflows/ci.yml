name: CI

# Once per change: pull requests, and main once they're merged. Pushes to a
# branch with a pull request open run under the pull request, not twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request replaces the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sh
          POSTGRES_PASSWORD: sh
          POSTGRES_DB: sh_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sh" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and sync tests (PGlite and real Postgres)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://sh:sh@localhost:5432/sh_test
      - name: Build the web app
        run: npm run build:web
      - name: Offline end-to-end test
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Blueprint builds
        run: npm run build:hub
