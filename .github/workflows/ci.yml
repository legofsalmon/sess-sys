name: CI

# Once per change: pull requests, and main once they're merged. Pushes to a
# branch with a pull request open run under the pull request, not twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request replaces the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The server tests and the browser tests run side by side on machines of
# their own, each split three ways (the browser thirds each with a server of
# their own), so a run takes as long as its slowest part rather than all of
# them end to end. The server tests are near half an hour of work in all,
# more than one machine's few cores get through quickly.
jobs:
  server:
    name: Server tests (${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sh
          POSTGRES_PASSWORD: sh
          POSTGRES_DB: sh_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sh" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The quick checks once, with the first third.
      - name: Typecheck
        if: matrix.shard == 1
        run: npm run typecheck
      - name: Shared tests
        if: matrix.shard == 1
        run: npm test -w shared
      - name: Blueprint builds
        if: matrix.shard == 1
        run: npm run build:hub
      - name: Unit and sync tests (PGlite and real Postgres)
        run: npm test -w server -- --shard=${{ matrix.shard }}/3
        env:
          TEST_DATABASE_URL: postgres://sh:sh@localhost:5432/sh_test

  e2e:
    name: Browser tests (${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    strategy:
      # Every third reports, so one failing doesn't hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web app
        run: npm run build:web
      - name: Offline end-to-end test
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --shard=${{ matrix.shard }}/3

  # The one check that says the run passed, under the name it has always had,
  # so whatever waits on "check" (merging, Railway's deploys) still does.
  check:
    needs: [server, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        run: |
          echo "server: ${{ needs.server.result }}, browser: ${{ needs.e2e.result }}"
          test "${{ needs.server.result }}" = success && test "${{ needs.e2e.result }}" = success
